<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
     <section id="headerContainer">
        <div class="header-left">
            <button class="sidebar-toggle" id="sidebarToggle" aria-label="Open Menu">
                <i class="fas fa-bars"></i>
            </button>
            <h1>Remedios Plastic Ware and Native Product</h1>
        </div>
        <h2 class="content-title" id="contentTitle">Dashboard</h2>
    <div class="app-layout">
        
        <section class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="brand-group">
                    <div class="brand-icon">
                        <i class="fas fa-shopping-bag"></i>
                    </div>
                    <div>
                        <p class="sidebar-logo">Remedios</p>
                        <span class="sidebar-subtitle">Admin Panel</span>
                    </div>
                </div>
                <button class="sidebar-close" id="sidebarClose" aria-label="Close Menu">
                    <i class="fas fa-times"></i>
                </button>
            </div>

            <nav class="sidebar-nav">
                <span class="nav-label">MAIN</span>
                <ul>
                    <li class="nav-item active">
                        <a class="nav-link" href="#dashboard" data-title="Dashboard">
                            <div class="nav-link-left">
                                <i class="fas fa-gauge-high"></i>
                                <span>Dashboard</span>
                            </div>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#inventory" data-title="Inventory">
                            <div class="nav-link-left">
                                <i class="fas fa-boxes-stacked"></i>
                                <span>Inventory</span>
                            </div>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#customers" data-title="Customer Orders">
                            <div class="nav-link-left">
                                <i class="fas fa-cart-shopping"></i>
                                <span>Customer Orders</span>
                            </div>
                            <span class="badge"></span>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#analytics" data-title="Analytics">
                            <div class="nav-link-left">
                                <i class="fas fa-chart-line"></i>
                                <span>Analytics</span>
                            </div>
                        </a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="#promotions" data-title="Promotions">
                            <div class="nav-link-left">
                                <i class="fas fa-tags"></i>
                                <span>Promotions</span>
                            </div>
                        </a>
                    </li>
                </ul>
            </nav>
        </section>

    </div>
</body>
</html>
